<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz "Jeweb Kenek Tefhemha"</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 15% 20%, rgba(79,70,229,.25), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(59,130,246,.20), transparent 30%),
        #070914;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    background: #6366f1;
    filter: blur(180px);
    opacity: .12;
    top: -200px;
    left: -150px;
    pointer-events: none;
}

body::after {
    content: "";
    position: fixed;
    width: 450px;
    height: 450px;
    background: #2563eb;
    filter: blur(180px);
    opacity: .12;
    bottom: -200px;
    right: -150px;
    pointer-events: none;
}

.quiz-container {
    width: 100%;
    max-width: 760px;

    background: rgba(15,18,35,.82);

    border: 1px solid rgba(129,140,248,.18);

    border-radius: 28px;

    padding: 42px;

    backdrop-filter: blur(20px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.5),
        0 0 80px rgba(79,70,229,.08);

    position: relative;
    overflow: hidden;
}

.quiz-container::before {
    content: "";

    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 3px;

    background:
        linear-gradient(
            90deg,
            #3b82f6,
            #6366f1,
            #a855f7
        );
}

.logo {
    text-align: center;

    font-size: 12px;
    font-weight: bold;

    letter-spacing: 5px;

    color: #818cf8;

    margin-bottom: 15px;
}

h1 {
    text-align: center;

    font-size: clamp(30px,6vw,46px);

    font-weight: 800;

    letter-spacing: -1px;

    background:
        linear-gradient(
            90deg,
            #60a5fa,
            #818cf8,
            #c084fc
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    margin-bottom: 10px;
}

.subtitle {
    text-align: center;

    color: #8b93aa;

    font-size: 15px;

    margin-bottom: 35px;
}

.progress-info {
    display: flex;

    justify-content: space-between;

    color: #707991;

    font-size: 13px;

    margin-bottom: 8px;
}

.progress {
    width: 100%;

    height: 7px;

    background: #1b2033;

    border-radius: 20px;

    overflow: hidden;

    margin-bottom: 25px;
}

.progress-bar {
    height: 100%;

    width: 0%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #2563eb,
            #6366f1,
            #a855f7
        );

    box-shadow:
        0 0 15px rgba(99,102,241,.7);

    transition: width .5s ease;
}

.question-number {
    color: #7c86a3;

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 2px;

    margin-bottom: 10px;
}

.timer {
    display: flex;

    justify-content: flex-end;
    align-items: center;

    gap: 6px;

    color: #8b93aa;

    font-size: 15px;

    font-weight: bold;

    margin-bottom: 12px;
}

.timer-number {
    min-width: 22px;

    text-align: center;

    color: white;

    font-size: 17px;
}

.timer.warning {
    color: #f87171;

    animation: timerPulse .5s infinite alternate;
}

.timer.warning .timer-number {
    color: #f87171;
}

@keyframes timerPulse {
    from {
        opacity: .6;
    }

    to {
        opacity: 1;
    }
}

.question {
    font-size: 25px;

    font-weight: 700;

    line-height: 1.4;

    margin-bottom: 27px;
}

.answers {
    display: grid;

    gap: 13px;
}

.answer {
    width: 100%;

    min-height: 62px;

    padding: 18px 20px;

    border-radius: 15px;

    border: 1px solid #292f47;

    background: rgba(24,29,48,.75);

    color: #e7e9f1;

    font-size: 15px;

    text-align: left;

    cursor: pointer;

    transition:
        transform .2s,
        border .2s,
        background .2s,
        box-shadow .2s;
}

.answer:hover {
    transform: translateY(-2px);

    border-color: #6366f1;

    background: rgba(49,46,129,.25);

    box-shadow:
        0 8px 25px rgba(79,70,229,.12);
}

.answer.correct {
    background: rgba(16,185,129,.15);

    border-color: #10b981;

    color: #6ee7b7;

    box-shadow:
        0 0 20px rgba(16,185,129,.12);
}

.answer.wrong {
    background: rgba(239,68,68,.12);

    border-color: #ef4444;

    color: #fca5a5;
}

.next-btn {
    width: 100%;

    margin-top: 25px;

    padding: 17px;

    border: none;

    border-radius: 14px;

    background:
        linear-gradient(
            90deg,
            #2563eb,
            #6366f1,
            #8b5cf6
        );

    color: white;

    font-size: 15px;

    font-weight: bold;

    letter-spacing: .5px;

    cursor: pointer;

    display: none;

    box-shadow:
        0 10px 30px rgba(79,70,229,.25);

    transition: .2s;
}

.next-btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 15px 35px rgba(79,70,229,.35);
}

.result {
    display: none;

    text-align: center;
}

.score {
    font-size: 85px;

    font-weight: 900;

    margin: 20px 0;

    background:
        linear-gradient(
            90deg,
            #60a5fa,
            #a78bfa
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.rank {
    font-size: 24px;

    font-weight: bold;

    margin-bottom: 15px;

    color: #c4b5fd;
}

.message {
    color: #8b93aa;

    line-height: 1.6;

    margin-bottom: 30px;
}

.restart {
    padding: 16px 35px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            90deg,
            #2563eb,
            #7c3aed
        );

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 10px 30px rgba(79,70,229,.25);

    transition: .2s;
}

.restart:hover {
    transform: translateY(-2px);

    box-shadow:
        0 15px 40px rgba(79,70,229,.4);
}

@media (max-width:600px) {

    body {
        padding: 12px;
    }

    .quiz-container {
        padding: 28px 20px;
        border-radius: 22px;
    }

    .question {
        font-size: 21px;
    }

    .answer {
        padding: 16px;
        min-height: 58px;
    }

    .score {
        font-size: 65px;
    }
}

</style>
</head>


<body>

<div class="quiz-container">

<div id="quiz">

<div class="logo">
EDITOR × FREELANCER
</div>

<h1>
THE EDITOR QUIZ
</h1>

<p class="subtitle">
Test your knowledge. Editing, freelancing & creativity.
</p>

<div class="progress-info">

<span id="category">
FREELANCE
</span>

<span id="questionCounter">
1 / 15
</span>

</div>

<div class="progress">

<div
class="progress-bar"
id="progressBar">
</div>

</div>

<div
class="question-number"
id="questionNumber">
</div>

<div
class="timer"
id="timer">

⏱️

<span
class="timer-number"
id="timerNumber">
15
</span>

s

</div>

<div
class="question"
id="question">
</div>

<div
class="answers"
id="answers">
</div>

<button
class="next-btn"
id="nextBtn">

NEXT QUESTION →

</button>

</div>


<div
class="result"
id="result">

<div class="logo">
FINAL RESULT
</div>

<h1>
QUIZ COMPLETE
</h1>

<div
class="score"
id="score">
</div>

<div
class="rank"
id="rank">
</div>

<p
class="message"
id="message">
</p>

<button
class="restart"
onclick="restartQuiz()">

PLAY AGAIN

</button>

</div>

</div>


<script>


/* ==========================================
   QUESTIONS
========================================== */

const questions = [

{
category: "FREELANCE",

question:
"What is a portfolio mainly used for as a freelancer? 🎬",

answers: [
"To calculate your taxes 💰",
"To show your previous work 🎬",
"To organize your invoices 🧾",
"To track your working hours ⏱️"
],

correct: 1
},


{
category: "FREELANCE",

question:
"What should you usually agree on with a client before starting a project? 🤝",

answers: [
"The project scope, price and deadline 📋",
"The project colors, music and software 🎨",
"The project logo, font and thumbnail 🖼️",
"The project platform, camera and format 🎥"
],

correct: 0
},


{
category: "FREELANCE",

question:
"What does a freelance client usually pay you for? 💼",

answers: [
"Your computer and internet connection 💻",
"Your social media account and followers 📱",
"Your service and the value you provide 💰",
"Your personal time and free availability ⏰"
],

correct: 2
},


{
category: "FREELANCE • HARD",

question:
"A client keeps asking for changes that were not included in the original scope. What is the most professional approach? 🧠",

answers: [
"Complete every extra change without mentioning payment 🆓",
"Explain that the extra work is outside the agreed scope and discuss an additional fee 💰",
"Refuse every future revision without explaining the reason ❌",
"Finish the changes first and decide about payment afterward ⏳"
],

correct: 1
},


{
category: "FREELANCE • HARD",

question:
"You have two potential clients. Client A offers $100 but needs the project tomorrow. Client B offers $250 with a comfortable deadline. What should you evaluate before choosing? 🤔",

answers: [
"Only the amount offered and nothing else 💵",
"Only the deadline and how quickly you can finish ⏱️",
"Scope, time required, communication, payment reliability and opportunity cost 📊",
"Which client has more followers and stronger social media presence 📱"
],

correct: 2
},


{
category: "VIDEO EDITING",

question:
"What does FPS stand for? 🎞️",

answers: [
"Frames Per Second 🎞️",
"Frames Per Scene 🎬",
"Final Production System 💻",
"Frame Processing Software ⚙️"
],

correct: 0
},


{
category: "VIDEO EDITING",

question:
"What is B-roll? 📹",

answers: [
"The main footage used for the entire video 🎥",
"Supporting footage used with the main footage 📹",
"The final version exported for the client 📦",
"A separate audio recording used during editing 🎙️"
],

correct: 1
},


{
category: "VIDEO EDITING",

question:
"Which software is commonly used for professional video editing? 💻",

answers: [
"Adobe Illustrator 🎨",
"Adobe Photoshop 🖼️",
"Adobe Premiere Pro 🎬",
"Microsoft Excel 📊"
],

correct: 2
},


{
category: "VIDEO EDITING • HARD",

question:
"What is the main purpose of a J-cut? ✂️",

answers: [
"The next scene's video appears before its audio begins 🎥",
"The next scene's audio starts before the visual cut 🔊",
"The current scene's audio becomes completely silent 🔇",
"The next scene automatically changes to a faster frame rate ⚡"
],

correct: 1
},


{
category: "VIDEO EDITING • HARD",

question:
"A video looks washed out after importing it into Premiere Pro. Which issue should you investigate first? 🎨",

answers: [
"Color management, gamma and color-space interpretation 🎨",
"The number of video tracks and sequence markers 📋",
"Keyboard shortcuts and timeline workspace settings ⌨️",
"The project name and location of the media folder 📁"
],

correct: 0
},


{
category: "MIXED",

question:
"A client sends you a 4K video but asks for an Instagram Reel. What format is usually appropriate? 📱",

answers: [
"Horizontal 16:9 🖥️",
"Square 1:1 ⬛",
"Vertical 9:16 📱",
"Classic 4:3 📺"
],

correct: 2
},


{
category: "MIXED",

question:
"Which one can make a short-form video more engaging? 🔥",

answers: [
"Using random transitions throughout the entire video ✨",
"Strong pacing and a good hook 🎯",
"Making every shot much longer than necessary 🐌",
"Removing sound so the visuals become more important 🔇"
],

correct: 1
},


{
category: "MIXED",

question:
"A client says: 'Make it more cinematic.' What should you do first? 🎬",

answers: [
"Increase saturation and sharpness immediately 🎨",
"Add several transitions to create more movement ✨",
"Ask what visual style or reference they mean 🧠",
"Add black bars before asking any questions 🖤"
],

correct: 2
},


{
category: "MIXED • HARD",

question:
"You have a 30-second Reel. The first 3 seconds are slow and contain no clear hook. What is the biggest potential problem? 📉",

answers: [
"The export resolution may become lower than expected 📺",
"Viewer retention may drop before the main value is delivered 📉",
"The computer may automatically reduce the audio quality 💻",
"The video may become incompatible with most editing software ⚠️"
],

correct: 1
},


{
category: "MIXED • HARD",

question:
"A client says the video feels 'professional' but boring. Which combination is most likely to improve it without simply adding effects? 🧠",

answers: [
"Maximum saturation, sharpness and stronger visual effects 🎨",
"More transitions, faster zooms and text on every shot ✨",
"Better pacing, stronger storytelling, sound design and intentional visual variation 🎬",
"Longer shots, less sound design and fewer changes in the visual rhythm 🐌"
],

correct: 2
}

];


/* ==========================================
   VARIABLES
========================================== */

let currentQuestion = 0;

let score = 0;

let answered = false;

let timeLeft = 15;

let timerInterval;


/* ==========================================
   ELEMENTS
========================================== */

const questionElement =
document.getElementById("question");

const answersElement =
document.getElementById("answers");

const questionNumber =
document.getElementById("questionNumber");

const nextBtn =
document.getElementById("nextBtn");

const progressBar =
document.getElementById("progressBar");

const categoryElement =
document.getElementById("category");

const questionCounter =
document.getElementById("questionCounter");

const timerElement =
document.getElementById("timer");

const timerNumber =
document.getElementById("timerNumber");


/* ==========================================
   SHUFFLE
========================================== */

function shuffle(array) {

const shuffled = [...array];

for (
let i = shuffled.length - 1;
i > 0;
i--
) {

const j =
Math.floor(
Math.random() * (i + 1)
);

[
shuffled[i],
shuffled[j]
] = [
shuffled[j],
shuffled[i]
];

}

return shuffled;

}


/* ==========================================
   LOAD QUESTION
========================================== */

function loadQuestion() {

answered = false;

nextBtn.style.display = "none";

const q =
questions[currentQuestion];

questionNumber.textContent =
`QUESTION ${currentQuestion + 1}`;

questionCounter.textContent =
`${currentQuestion + 1} / ${questions.length}`;

categoryElement.textContent =
q.category;

questionElement.textContent =
q.question;

answersElement.innerHTML = "";


/* RANDOM ANSWERS */

const shuffledAnswers =
shuffle(
q.answers.map(
(answer,index) => ({
text: answer,
originalIndex: index
})
)
);


shuffledAnswers.forEach(
(answer,index) => {

const button =
document.createElement("button");

button.classList.add("answer");

button.textContent =
`${String.fromCharCode(65 + index)}. ${answer.text}`;

button.onclick = () =>
selectAnswer(
button,
answer.originalIndex
);

answersElement.appendChild(button);

}
);


const progress =
(currentQuestion /
questions.length) * 100;

progressBar.style.width =
progress + "%";

startTimer();

}


/* ==========================================
   TIMER
========================================== */

function startTimer() {

clearInterval(timerInterval);

timeLeft = 15;

timerNumber.textContent =
timeLeft;

timerElement.classList.remove(
"warning"
);

timerInterval =
setInterval(() => {

timeLeft--;

timerNumber.textContent =
timeLeft;

if (timeLeft <= 5) {

timerElement.classList.add(
"warning"
);

}

if (timeLeft <= 0) {

clearInterval(timerInterval);

timeOut();

}

},1000);

}


/* ==========================================
   TIME OUT
========================================== */

function timeOut() {

if (answered)
return;

answered = true;

clearInterval(timerInterval);

nextBtn.style.display = "none";


/* ZERO POINTS */

setTimeout(() => {

currentQuestion++;

if (
currentQuestion <
questions.length
) {

loadQuestion();

}

else {

showResult();

}

},500);

}


/* ==========================================
   SELECT ANSWER
========================================== */

function selectAnswer(
button,
selectedIndex
) {

if (answered)
return;

answered = true;

clearInterval(timerInterval);

const correctIndex =
questions[currentQuestion].correct;

const allAnswers =
document.querySelectorAll(".answer");


if (
selectedIndex ===
correctIndex
) {

button.classList.add("correct");

score++;

}

else {

button.classList.add("wrong");

allAnswers.forEach(
answerButton => {

const answerText =
answerButton.textContent.substring(3);

if (
answerText ===
questions[currentQuestion]
.answers[correctIndex]
) {

answerButton.classList.add(
"correct"
);

}

});

}

nextBtn.style.display =
"block";

}


/* ==========================================
   NEXT
========================================== */

nextBtn.onclick =
function() {

currentQuestion++;

if (
currentQuestion <
questions.length
) {

loadQuestion();

}

else {

showResult();

}

};


/* ==========================================
   RESULT
========================================== */

function showResult() {

clearInterval(timerInterval);

document.getElementById("quiz")
.style.display = "none";

document.getElementById("result")
.style.display = "block";

document.getElementById("score")
.textContent =
`${score}/${questions.length}`;

let rank;

let message;


if (score <= 5) {

rank =
"🎬 BEGINNER EDITOR";

message =
"You know the basics. Keep practicing, build your portfolio and keep learning.";

}

else if (score <= 9) {

rank =
"⚡ INTERMEDIATE EDITOR";

message =
"Good knowledge! You understand the fundamentals of editing and freelancing.";

}

else if (score <= 12) {

rank =
"🔥 PRO EDITOR";

message =
"Very solid! You understand both the creative and business side.";

}

else {

rank =
"👑 EDITING BEAST";

message =
"You actually know your stuff. Time to turn those skills into money.";

}


document.getElementById("rank")
.textContent = rank;

document.getElementById("message")
.textContent = message;

}


/* ==========================================
   RESTART
========================================== */

function restartQuiz() {

clearInterval(timerInterval);

currentQuestion = 0;

score = 0;

answered = false;

document.getElementById("result")
.style.display = "none";

document.getElementById("quiz")
.style.display = "block";

loadQuestion();

}


/* ==========================================
   START
========================================== */

loadQuestion();

</script>

</body>
</html>
